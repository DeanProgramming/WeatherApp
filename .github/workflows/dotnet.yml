name: Build, test and publish WeatherApp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.308'

      - name: Restore dependencies
        run: dotnet restore DeanH-WeatherApp.sln

      - name: Build solution
        run: dotnet build DeanH-WeatherApp.sln --configuration Release --no-restore

      - name: Run NUnit tests
        id: tests
        run: >-
          dotnet test DeanH-WeatherApp.sln --configuration Release --no-build
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=weather-tests.trx"
          --results-directory "$RUNNER_TEMP/TestResults"
          -- RunConfiguration.TreatNoTestsAsError=true

      - name: Report NUnit results
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        shell: pwsh
        run: |
          [xml]$trx = Get-Content -LiteralPath "$env:RUNNER_TEMP/TestResults/weather-tests.trx" -Raw -ErrorAction Stop
          $counts = $trx.TestRun.ResultSummary.Counters
          "NUnit: $($counts.executed)/$($counts.total) executed, $($counts.passed) passed, $($counts.failed) failed." >> $env:GITHUB_STEP_SUMMARY
          if ([int]$counts.passed -lt 1) { throw 'No NUnit tests passed.' }

      - name: Upload test results
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ${{ runner.temp }}/TestResults/weather-tests.trx
          if-no-files-found: error

      - name: Publish web app
        run: dotnet publish DeanH-WeatherApp/DeanH-WeatherApp.csproj --configuration Release --no-build --output website

      - name: Upload web app
        uses: actions/upload-artifact@v7
        with:
          name: website
          path: website/
          if-no-files-found: error
